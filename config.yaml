# ======================================================================
#  Configuration de robot-hand-sim — TOUS les réglages sont ici.
#  Ordre des listes de 5 valeurs : pouce, index, majeur, annulaire, auriculaire
# ======================================================================

# Sortie : "sim" (main 3D dans le navigateur), "serial" (Arduino) ou "both".
# Peut être remplacée en ligne de commande : python main.py --mode serial
mode: sim

camera:
  index: 0            # 0 = webcam intégrée, 1 = deuxième caméra, ...
  width: 640
  height: 480
  fps: 30
  api: dshow          # Windows : "dshow" (rapide à ouvrir) ou "msmf" ; ailleurs : "any"
  mirror: true        # Affichage en miroir (touche m pour basculer)
  # Exposition : "auto" = image plus claire, mais dans une pièce peu éclairée la
  # webcam allonge son temps de pose et tombe à 15 FPS. Une valeur fixe (DirectShow :
  # -5 ≈ 1/32 s) garantit 30 FPS ; -6 si l'image est trop claire, -4 si trop sombre
  # (mais -4 peut redescendre à 15 FPS).
  exposure: -5

tracking:
  model_path: models/hand_landmarker.task
  model_url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
  min_detection_confidence: 0.6
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5

angles:
  # Lissage EMA : 1.0 = aucun lissage (réactif mais tremblant), 0.1 = très lisse.
  smoothing_alpha: 0.45
  # Vitesse du retour vers « main ouverte » quand la main n'est plus détectée.
  return_alpha: 0.06
  # Angle servo (degrés) correspondant à 0 % (tendu) et 100 % (plié), par doigt.
  min_angles: [0, 0, 0, 0, 0]
  max_angles: [180, 180, 180, 180, 180]
  # true = servo monté à l'envers sur la vraie main (inverse le sens).
  invert: [false, false, false, false, false]

wrist:
  # Poignet : rotation (pronation/supination) et inclinaison latérale.
  # Mesurés par rapport à la pose neutre enregistrée par la calibration (touche c),
  # en supposant que l'avant-bras reste à peu près immobile (coude posé).
  # enabled: false → trame série à 5 valeurs (doigts seuls) ; true → 7 valeurs.
  enabled: true
  smoothing_alpha: 0.35
  rotation:             # Rotation autour de l'avant-bras ; + = paume qui tourne vers le pouce
    enabled: true       # false → le servo reste en position neutre
    range_deg: [-90, 90]  # Angle mesuré qui correspond à min_angle / max_angle
    min_angle: 0
    max_angle: 180
    invert: false
  deviation:            # Inclinaison latérale ; + = main penchée vers le pouce
    enabled: true
    range_deg: [-30, 30]
    min_angle: 45
    max_angle: 135
    invert: false

calibration:
  file: calibration.json
  countdown_s: 3.0    # Temps pour prendre la pose avant chaque capture
  capture_s: 1.0      # Durée de chaque capture (médiane des mesures)

sim:
  host: 127.0.0.1
  http_port: 8000     # Port du serveur web qui sert la page 3D
  ws_port: 8765       # Port WebSocket qui diffuse les angles
  open_browser: true

serial:
  port: COM3          # Gestionnaire de périphériques → Ports (COM et LPT)
  baudrate: 115200
  send_rate_hz: 50    # Fréquence max d'envoi des trames
  reconnect_interval_s: 2.0

demo:
  speed: 1.0          # Vitesse des mouvements automatiques (--demo)
